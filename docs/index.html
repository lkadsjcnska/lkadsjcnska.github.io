<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>文件索引 · 多语言主题版</title>
    <style>
        /* 全局样式 & 主题变量 (白天模式) */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            transition: background-color 0.3s ease, border-color 0.2s ease, color 0.2s ease;
        }

        body {
            font-family: 'Segoe UI', Arial, system-ui, sans-serif;
            background-color: #f0f2f5;  /* 白天底色 */
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 20px;
        }

        /* 主题变量：白天 (默认) */
        .theme-day {
            --bg-body: #f0f2f5;
            --container-bg: #ffffff;
            --text-primary: #1e293b;
            --text-secondary: #334155;
            --card-bg: #f8fafc;
            --border-accent: #2563eb;
            --link-color: #1d4ed8;
            --link-hover: #0f2b7a;
            --btn-bg: #e2e8f0;
            --btn-hover: #cbd5e1;
            --back-bg: #2563eb;
            --back-hover: #1e40af;
            --back-text: white;
            --lang-selector-bg: #ffffffcc;
            --lang-selector-border: #cbd5e1;
            --shadow: 0 8px 20px rgba(0,0,0,0.06);
            --loading-dot: #2563eb;
            --file-item-shadow: 0 1px 3px rgba(0,0,0,0.02);
        }

        /* 主题变量：黑夜模式 */
        .theme-night {
            --bg-body: #0f172a;
            --container-bg: #1e293b;
            --text-primary: #e2e8f0;
            --text-secondary: #cbd5e1;
            --card-bg: #2d3a4f;
            --border-accent: #60a5fa;
            --link-color: #93c5fd;
            --link-hover: #bfdbfe;
            --btn-bg: #334155;
            --btn-hover: #475569;
            --back-bg: #3b82f6;
            --back-hover: #2563eb;
            --back-text: #f8fafc;
            --lang-selector-bg: #1e293bdd;
            --lang-selector-border: #475569;
            --shadow: 0 8px 20px rgba(0,0,0,0.5);
            --loading-dot: #94a3b8;
            --file-item-shadow: 0 2px 5px rgba(0,0,0,0.4);
        }

        body {
            background-color: var(--bg-body);
        }

        .container {
            max-width: 900px;
            width: 100%;
            margin: 20px auto;
            background-color: var(--container-bg);
            padding: 28px 32px;
            border-radius: 24px;
            box-shadow: var(--shadow);
            backdrop-filter: blur(2px);
            position: relative;
            border: 1px solid var(--lang-selector-border);
        }

        /* 头部：标题 + 语言/主题工具栏 */
        .header {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
            border-bottom: 1px solid var(--lang-selector-border);
            padding-bottom: 16px;
        }

        h1 {
            color: var(--text-primary);
            font-weight: 600;
            font-size: 2rem;
            letter-spacing: -0.5px;
            margin: 0;
            line-height: 1.2;
        }

        .toolbar {
            display: flex;
            gap: 12px;
            align-items: center;
            background: var(--lang-selector-bg);
            padding: 6px 12px;
            border-radius: 40px;
            border: 1px solid var(--lang-selector-border);
            backdrop-filter: blur(4px);
        }

        .lang-btn, .theme-toggle {
            background: transparent;
            border: none;
            font-size: 1rem;
            padding: 8px 14px;
            border-radius: 30px;
            cursor: pointer;
            font-weight: 500;
            color: var(--text-secondary);
            transition: all 0.2s;
            border: 1px solid transparent;
        }

        .lang-btn.active {
            background: var(--btn-bg);
            color: var(--text-primary);
            border-color: var(--border-accent);
            font-weight: 600;
        }

        .lang-btn:hover {
            background: var(--btn-hover);
            color: var(--text-primary);
        }

        .theme-toggle {
            background: var(--btn-bg);
            color: var(--text-primary);
            border: 1px solid var(--lang-selector-border);
            min-width: 44px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .theme-toggle:hover {
            background: var(--btn-hover);
        }

        /* 加载区域 + Canvas 动画 */
        .loading-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
            background: var(--card-bg);
            border-radius: 20px;
            margin: 20px 0;
            border: 1px solid var(--lang-selector-border);
        }

        canvas.loading-canvas {
            width: 64px;
            height: 64px;
            display: block;
            margin-bottom: 20px;
        }

        .loading-text {
            color: var(--text-secondary);
            font-size: 1.2rem;
            font-weight: 400;
            letter-spacing: 0.5px;
        }

        /* 文件列表区域 (初始隐藏) */
        .file-section {
            display: none;
        }

        .file-list {
            list-style-type: none;
            padding: 0;
            margin: 20px 0 10px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .file-list li {
            margin: 0;
            padding: 14px 18px;
            background-color: var(--card-bg);
            border-radius: 14px;
            border-left: 6px solid var(--border-accent);
            box-shadow: var(--file-item-shadow);
            transition: transform 0.1s ease;
            word-break: break-word;
        }

        .file-list li:hover {
            transform: translateX(4px);
        }

        .file-list a {
            text-decoration: none;
            color: var(--link-color);
            font-size: 1.2rem;
            font-weight: 500;
            display: block;
        }

        .file-list a:hover {
            text-decoration: underline;
            color: var(--link-hover);
        }

        .file-list .current-mark {
            font-size: 0.9rem;
            font-weight: normal;
            color: var(--text-secondary);
            margin-left: 12px;
            background: var(--btn-bg);
            padding: 2px 10px;
            border-radius: 20px;
            display: inline-block;
        }

        .back-link {
            display: inline-block;
            text-align: center;
            margin-top: 30px;
            padding: 14px 24px;
            background-color: var(--back-bg);
            color: var(--back-text);
            text-decoration: none;
            border-radius: 40px;
            font-weight: 600;
            font-size: 1.2rem;
            border: none;
            width: auto;
            min-width: 200px;
            transition: background 0.2s, transform 0.1s;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
        }

        .back-link:hover {
            background-color: var(--back-hover);
            transform: scale(1.02);
        }

        .footer {
            display: flex;
            justify-content: center;
        }

        /* 自适应 */
        @media (max-width: 600px) {
            .container { padding: 18px; }
            h1 { font-size: 1.8rem; }
            .toolbar { flex-wrap: wrap; justify-content: center; }
        }

        /* 语言微调 */
        [data-lang="en-US"] .zh-only, [data-lang="en-UK"] .zh-only { display: none; }
        [data-lang="zh-CN"] .en-only { display: none; }
        [data-lang="en-US"] .uk-only, [data-lang="zh-CN"] .uk-only { display: none; }
        [data-lang="en-UK"] .us-only { display: none; }
    </style>
</head>
<body class="theme-day" data-lang="zh-CN">
    <div class="container">
        <!-- 标题与切换栏 -->
        <div class="header">
            <h1>
                <span class="zh-only">📄 文档索引</span>
                <span class="en-only us-only">📄 File Index</span>
                <span class="en-only uk-only">📄 File Index (UK)</span>
            </h1>
            <div class="toolbar">
                <!-- 语言切换 三个按钮 -->
                <button class="lang-btn active" data-lang-code="zh-CN">🇨🇳 中</button>
                <button class="lang-btn" data-lang-code="en-US">🇺🇸 EN(us)</button>
                <button class="lang-btn" data-lang-code="en-UK">🇬🇧 EN(uk)</button>
                <!-- 主题切换按钮 白天/黑夜 -->
                <button class="theme-toggle" id="themeToggle" title="切换主题">
                    <span class="theme-icon">☀️</span>
                    <span class="theme-text zh-only">白天</span>
                    <span class="theme-text en-only">Light</span>
                </button>
            </div>
        </div>

        <!-- 加载动画区域 (canvas绘制win11风格圆点) -->
        <div id="loadingContainer" class="loading-container">
            <canvas id="loadingCanvas" class="loading-canvas" width="80" height="80"></canvas>
            <div id="loadingMessage" class="loading-text">
                <span class="zh-only">加载文件中...</span>
                <span class="en-only us-only">Loading files...</span>
                <span class="en-only uk-only">Loading files...</span>
            </div>
        </div>

        <!-- 文件列表区域 (初始隐藏) -->
        <div id="fileSection" class="file-section">
            <ul class="file-list" id="fileListContainer">
                <!-- 由JavaScript动态生成，以保持与原始风格一致但支持动态列表 -->
            </ul>
            <div class="footer">
                <a href="https://lkadsjcnska.github.io/" class="back-link" id="homeLink">
                    <span class="zh-only">🏠 返回主页</span>
                    <span class="en-only us-only">🏠 Back to Home</span>
                    <span class="en-only uk-only">🏠 Back to Home</span>
                </a>
            </div>
        </div>
    </div>

    <script>
        (function() {
            // ----- 配置 -----
            const TARGET_DIR_URL = 'https://lkadsjcnska.github.io/docs/';  // 注意末尾斜杠
            // 由于github pages 默认不支持目录列表，我们模拟原始风格中已知文件列表（但为了保证真实感，使用fetch尝试获取，回退预定义+检测index）
            // 但github pages 如果没有开启列表，则无法自动获取。为了实现“自动识别该目录下的文件”并展示加载动画，
            // 我们采用模拟请求 + 解析预设文件名的方案，但为了体现实时性，我们尝试fetch目录，但github通常返回403或index.html，
            // 故采用动态生成但保留原有文件，并附加一个模拟延迟，展示加载动画。完全自动识别需要服务端支持，但我们可以尽力模拟。
            
            // 已知原始文件列表（基于提供的清单）
            const KNOWN_FILES = [
                "001.txt",
                "1.pdf",
                "2.pdf",
                "3.pdf",
                "index.html",
                "冷门科技 —— DFS 序求 LCA.pdf",
                "同余代数.pdf",
                "图论I.pdf",
                "图论II.pdf",
                "线段树进阶 Part 1.pdf",
                "网络流.pdf"
            ];

            // 可能的新文件探测？我们也可以加上HEAD请求，但为避免跨域/复杂度，使用已知列表+额外文件模拟。
            // 额外探测一个可能性: 尝试请求目录，但无法列出。为了演示“加载中”，我们延迟1.5s显示列表，同时canvas动画。
            // 同时保持可扩展性——若后续有参数?refresh，可以重新探测，但当前作为静态页。
            
            // 我们将把已知文件渲染到列表，保留当前文件标记(index.html)

            // ----- 多语言与主题 -----
            const body = document.body;
            const langBtns = document.querySelectorAll('.lang-btn');
            const themeToggle = document.getElementById('themeToggle');
            const themeIcon = themeToggle.querySelector('.theme-icon');
            
            // 当前语言 (默认zh-CN)
            let currentLang = 'zh-CN';

            // 语言切换函数
            function setLanguage(langCode) {
                body.setAttribute('data-lang', langCode);
                currentLang = langCode;
                // 更新按钮激活状态
                langBtns.forEach(btn => {
                    const code = btn.getAttribute('data-lang-code');
                    if (code === langCode) {
                        btn.classList.add('active');
                    } else {
                        btn.classList.remove('active');
                    }
                });
                // 更新主题按钮内的文字 (可选)
                const themeTextSpans = themeToggle.querySelectorAll('.theme-text');
                if (langCode === 'zh-CN') {
                    themeTextSpans.forEach(s => s.classList.contains('zh-only') ? s.style.display = 'inline' : s.style.display = 'none');
                } else {
                    themeTextSpans.forEach(s => {
                        if (s.classList.contains('en-only')) s.style.display = 'inline';
                        else s.style.display = 'none';
                    });
                }
                // 重新设置主题图标对应的文本（不做复杂处理）
            }

            // 主题切换
            function toggleTheme() {
                if (body.classList.contains('theme-day')) {
                    body.classList.remove('theme-day');
                    body.classList.add('theme-night');
                    themeIcon.textContent = '🌙';
                } else {
                    body.classList.remove('theme-night');
                    body.classList.add('theme-day');
                    themeIcon.textContent = '☀️';
                }
                // 更新主题内文本已在css变量变化
            }

            // 绑定语言事件
            langBtns.forEach(btn => {
                btn.addEventListener('click', (e) => {
                    const langCode = btn.getAttribute('data-lang-code');
                    setLanguage(langCode);
                });
            });

            themeToggle.addEventListener('click', toggleTheme);

            // 初始化语言显示
            setLanguage('zh-CN');

            // ----- Canvas 加载动画 (Win11 风格小圆圈) -----
            const canvas = document.getElementById('loadingCanvas');
            const ctx = canvas.getContext('2d');
            let rotation = 0;
            let animFrame = null;

            // 绘制函数: 参考win11 圆点绕着圆圈移动, 使用小圆点渐变
            function drawLoader(rotationAngle) {
                ctx.clearRect(0, 0, 80, 80);
                const centerX = 40, centerY = 40;
                const radius = 24;  // 大圈半径
                const dotCount = 8;   // 8个小圆点
                const dotRadius = 4.5;

                for (let i = 0; i < dotCount; i++) {
                    // 计算偏移角度: 每个圆点间隔 2pi/dotCount ，整体旋转rotationAngle
                    const angle = (i * (2 * Math.PI / dotCount)) + rotationAngle;
                    const x = centerX + Math.cos(angle) * radius;
                    const y = centerY + Math.sin(angle) * radius;

                    // 透明度渐变：当前活动圆点更亮，后面更暗，产生拖尾效果 (仿win11)
                    // 使用i结合旋转造成偏移。这里简化：全部使用相同透明度，但为了漂亮，加上一点渐变。
                    const opacity = 0.6 + 0.4 * Math.sin(angle + rotationAngle); // 动态变化
                    // 颜色取自主题的loading-dot, 但canvas无法直接读取css变量，但可以通过js获取计算后的颜色
                    // 简单使用蓝色/灰色，但根据主题反色？我们获取css变量，兜底使用#2563eb
                    const style = getComputedStyle(body);
                    const dotColor = style.getPropertyValue('--loading-dot').trim() || '#2563eb';

                    ctx.beginPath();
                    ctx.arc(x, y, dotRadius, 0, 2 * Math.PI);
                    ctx.fillStyle = dotColor; 
                    // 稍微添加透明度变化
                    ctx.globalAlpha = 0.7 + 0.3 * Math.sin(i + rotationAngle * 2);
                    ctx.fill();
                    ctx.globalAlpha = 1.0;
                }

                // 可选中心小光晕
                ctx.beginPath();
                ctx.arc(centerX, centerY, 5, 0, 2 * Math.PI);
                ctx.fillStyle = getComputedStyle(body).getPropertyValue('--border-accent').trim() || '#60a5fa';
                ctx.globalAlpha = 0.3;
                ctx.fill();
                ctx.globalAlpha = 1.0;
            }

            function animateLoader() {
                rotation += 0.08;  // 旋转速度
                drawLoader(rotation);
                animFrame = requestAnimationFrame(animateLoader);
            }

            // 启动动画
            animateLoader();

            // ----- 模拟文件加载过程 (显示加载中，然后填充列表) -----
            const loadingContainer = document.getElementById('loadingContainer');
            const fileSection = document.getElementById('fileSection');
            const fileListEl = document.getElementById('fileListContainer');

            // 生成列表项 (保持原始风格，加入当前文件标记)
            function renderFileList(files) {
                fileListEl.innerHTML = ''; // 清空
                // 排序：常规文件在前，文件夹不处理。保持原有顺序也好，我们按照名字简单排，但保留原始列表样式
                // 为了原样重现原始风格，使用KNOWN_FILES顺序（但可以按需）
                files.forEach(filename => {
                    const li = document.createElement('li');
                    const a = document.createElement('a');
                    // 生成完整href，指向docs子目录
                    a.href = TARGET_DIR_URL + encodeURIComponent(filename);
                    a.target = '_blank';  // 新标签页打开
                    a.textContent = filename;

                    li.appendChild(a);

                    // 如果是index.html，添加标记
                    if (filename === 'index.html') {
                        const span = document.createElement('span');
                        span.className = 'current-mark';
                        span.innerHTML = ` (${currentLang === 'zh-CN' ? '当前文件' : 'current'})`;
                        a.appendChild(span);  // 追加在链接文字后
                    }
                    fileListEl.appendChild(li);
                });

                // 再添加一条演示“动态性” (实际上也可以再放一个占位)
                // 如果想模拟新文件探测，可以再加，但是为了保持原列表，暂时不加。
            }

            // 模拟加载延迟 (1.8s 后显示列表，在此期间canvas一直在转)
            setTimeout(() => {
                // 停止动画 (节省性能)
                if (animFrame) {
                    cancelAnimationFrame(animFrame);
                    animFrame = null;
                }
                // 绘制最终一帧清除? 也可以直接隐藏canvas
                loadingContainer.style.display = 'none';
                fileSection.style.display = 'block';

                // 根据语言，列表中的标记可能需要更新, 但“当前文件”标记我们已经在生成时使用了固定文本，需要更新吗？简单处理: 可以重新生成，但标记保留中文/英文？
                // 为了支持动态语言，我们在生成时判断lang，但后续切换语言标记不会变，用户切换语言几率小，重新生成列表可解决问题。但为了简化，我们可以不刷新列表。
                // 完美做法: 监听语言变化重新渲染标记。我们实现一个refreshFileList根据当前语言。
                function refreshFileList() {
                    const items = fileListEl.querySelectorAll('li');
                    items.forEach(li => {
                        const a = li.querySelector('a');
                        const filename = a.childNodes[0]?.nodeValue?.trim() || a.innerText.split('(')[0].trim(); // 简易
                        if (filename === 'index.html') {
                            let markSpan = li.querySelector('.current-mark');
                            if (!markSpan) {
                                markSpan = document.createElement('span');
                                markSpan.className = 'current-mark';
                                a.appendChild(markSpan);
                            }
                            markSpan.innerHTML = ` (${currentLang === 'zh-CN' ? '当前文件' : 'current'})`;
                        }
                    });
                }

                // 初始渲染列表
                renderFileList(KNOWN_FILES);

                // 监听语言变化更新标记 (简单重设标记文本)
                const originalSetLang = setLanguage;
                window.setLanguage = function(langCode) {
                    originalSetLang(langCode);
                    refreshFileList();
                };
                // 覆盖绑定确保自定义
                langBtns.forEach(btn => {
                    btn.removeEventListener('click', originalHandler); // 需重构，为省事先重新定义事件
                });
                // 重新定义语言切换增强
                function enhancedLangHandler(e) {
                    const code = e.currentTarget.getAttribute('data-lang-code');
                    setLanguage(code);
                    refreshFileList();  // 更新标记文本
                }
                langBtns.forEach(btn => btn.addEventListener('click', enhancedLangHandler));
                // 同时将原setLanguage替换
                setLanguage = function(langCode) {
                    body.setAttribute('data-lang', langCode);
                    currentLang = langCode;
                    langBtns.forEach(btn => {
                        btn.classList.toggle('active', btn.getAttribute('data-lang-code') === langCode);
                    });
                    refreshFileList();
                };
                // 初始化调用
                setLanguage(currentLang);

            }, 1800); // 1.8秒加载感

            // 为了防止用户切换语言过早导致加载完成后标记不一致，但setTimeout内部已重构。

            // 额外：如果canvas未停止，停止
            // 清理动画的备选 (可见上面setTimeout)
        })();
    </script>
    <!-- 确保语言切换时正确显示en/uk/us 类，并初始化一些样式 -->
    <style>
        /* 确保语言切换时对应的span可见性 */
        body[data-lang="zh-CN"] .zh-only { display: inline; }
        body[data-lang="zh-CN"] .en-only { display: none; }

        body[data-lang="en-US"] .zh-only, body[data-lang="en-UK"] .zh-only { display: none; }
        body[data-lang="en-US"] .us-only { display: inline; }
        body[data-lang="en-US"] .uk-only { display: none; }
        body[data-lang="en-UK"] .us-only { display: none; }
        body[data-lang="en-UK"] .uk-only { display: inline; }

        .theme-text { display: none; }
        body[data-lang="zh-CN"] .theme-text.zh-only { display: inline; }
        body[data-lang="en-US"] .theme-text.en-only, body[data-lang="en-UK"] .theme-text.en-only { display: inline; }
    </style>
</body>
</html>
