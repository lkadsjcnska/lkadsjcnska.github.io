name: Update Document Translation


on:
  push:
    paths:
      - "docs/**"
    paths-ignore:
      - "docs/translations.json"


permissions:
  contents: write


jobs:

  translate:

    runs-on: ubuntu-latest


    steps:

    - name: Checkout
      uses: actions/checkout@v4


    - name: Setup Python
      uses: actions/setup-python@v5

      with:
        python-version: "3.12"


    - name: Install dependencies
      run: |
        pip install deepl


    - name: Generate translation

      env:
        DEEPL_KEY: ${{ secrets.DEEPL_KEY }}

      run: |
        python tools/translate.py


    - name: Commit translation file

      run: |

        git config user.name "github-actions"

        git config user.email "actions@github.com"

        git add docs/translations.json

        git commit -m "Auto update translations" || echo "No changes"

        git push
