<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>你上当了！</title>
    <!-- 网站图标 -->
    <link rel="icon" href="https://lkadsjcnska.github.io/something/pic.png">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "楷体", "KaiTi", serif;
        }
        body {
            text-align: center;
            background-color: #f5f5f5;
            padding: 20px;
        }
        /* 图片样式 */
        img {
            max-width: 100%;
            height: auto;
            margin-bottom: 30px;
            border-radius: 8px;
        }
        /* 底部文字容器 */
        .text-box {
            font-size: 22px;
            line-height: 1.8;
            color: #333;
        }
        /* 循环炫彩文字 */
        .rainbow-text {
            font-size: 28px;
            font-weight: bold;
            margin-bottom: 10px;
            animation: colorLoop 3s linear infinite;
        }
        /* RGB从#000000到#ffffff循环渐变 */
        @keyframes colorLoop {
            0% { color: #000000; }
            50% { color: #ffffff; }
            100% { color: #000000; }
        }
    </style>
</head>
<body>
    <!-- 主体图片 -->
    <img src="https://lkadsjcnska.github.io/something/pic.png" alt="上当了">

    <!-- 底部文字 -->
    <div class="text-box">
        <div class="rainbow-text">哈哈哈，你被骗了</div>
        <p>还想吃你那破冰淇淋</p>
        <p>简直就是痴心妄想</p>
        <p>迷途知返吧</p>
        <img src="https://lkadsjcnska.github.io/something/pic1.png" alt="嘿嘿">
        <p>红红火火恍恍惚惚哈哈哈哈哈哈哈哈哈哈哈哈哈哈</p>
    </div>
</body>
</html>
