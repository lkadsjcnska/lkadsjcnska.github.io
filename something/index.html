<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" href="https://s21.ax1x.com/2025/08/28/pV660mT.png" type="image/png">
    <title>训练中心 | 小草的博客</title>
    <link rel="stylesheet" href="../assets/css/style.css?v=507fc28821f8badbcb2d6b068e50e1ee9b618144">
    <style>
      .training-container {
        display: flex;
        flex-wrap: wrap;
        gap: 20px;
        justify-content: center;
        margin: 30px 0;
      }
      .training-card {
        background: #f5f5f5;
        border-radius: 10px;
        padding: 20px;
        width: 300px;
        text-align: center;
        box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        transition: transform 0.3s;
      }
      .training-card:hover {
        transform: translateY(-5px);
        box-shadow: 0 6px 12px rgba(0,0,0,0.15);
      }
      .training-card h2 {
        color: #2c3e50;
        margin-top: 0;
      }
      .btn {
        display: inline-block;
        padding: 10px 20px;
        background: #3498db;
        color: white;
        text-decoration: none;
        border-radius: 5px;
        margin: 10px 5px;
        transition: background 0.3s;
      }
      .btn:hover {
        background: #2980b9;
      }
    </style>
  </head>
  <body>
    <div class="wrapper">
      <header>
        <h1><a href="https://lkadsjcnska.github.io/">小草的博客</a></h1>
        <p>训练中心 - 提升您的鼠标和键盘操作技能</p>
      </header>
      <section>
        <h2>欢迎来到训练中心</h2>
        <p>选择下面的训练项目开始提升您的操作技能：</p>
        
        <div class="training-container">
          <div class="training-card">
            <h2>鼠标训练</h2>
            <p>提高鼠标操作的准确性和速度，包括单击、双击、右击和拖动等操作。</p>
            <a href="mouse_training.html" class="btn">开始训练</a>
          </div>
          
          <div class="training-card">
            <h2>键盘训练</h2>
            <p>通过5个不同难度的关卡，提升您的键盘打字速度和准确度。</p>
            <a href="keyboard_training.html" class="btn">开始训练</a>
          </div>
        </div>
      </section>
      <footer>
        <p><small>Hosted on GitHub Pages &mdash; Theme by <a href="https://github.com/orderedlist">orderedlist</a></small></p>
      </footer>
    </div>
  </body>
</html>
