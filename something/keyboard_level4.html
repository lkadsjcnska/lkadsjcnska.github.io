<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>键盘训练 - 关卡 4: 组合键操作</title>
    <link rel="icon" href="https://s21.ax1x.com/2025/08/28/pV660mT.png" type="image/png">
    <link rel="stylesheet" href="css/style.css">
    <style>
        .shortcut-exercise {
            margin: 20px 0;
            padding: 15px;
            border: 1px solid #ddd;
            border-radius: 5px;
            background: #f9f9f9;
        }
        .exercise-instruction {
            font-size: 18px;
            margin-bottom: 10px;
        }
        .key-combination {
            display: inline-block;
            padding: 5px 10px;
            background: #2c3e50;
            color: white;
            border-radius: 3px;
            margin: 0 5px;
            font-family: monospace;
        }
        .feedback {
            margin-top: 10px;
            padding: 10px;
            border-radius: 3px;
            display: none;
        }
        .feedback.correct {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        .feedback.incorrect {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
        .completion-message {
            text-align: center;
            padding: 20px;
            background: #d4edda;
            border-radius: 5px;
            margin: 20px 0;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>键盘训练 - 关卡 4</h1>
            <nav>
                <a href="keyboard_training.html">返回训练主页</a>
                <a href="index.html">返回主页面</a>
            </nav>
        </header>
        
        <div class="typing-test">
            <h2>组合键操作练习</h2>
            <p>按照提示按下正确的组合键</p>
            
            <div class="stats-bar">
                <div>已完成: <span id="completed-count">0</span>/5</div>
                <div>正确率: <span id="accuracy-rate">0%</span></div>
            </div>
            
            <div id="exercises-container">
                <!-- 练习项目将通过JavaScript动态生成 -->
            </div>
            
            <div id="completion-screen" style="display: none;">
                <div class="completion-message">
                    <h2>恭喜！组合键练习完成</h2>
                    <p>您已掌握基本的组合键操作</p>
                    <button id="next-level-btn" class="btn">下一关卡</button>
                </div>
            </div>
        </div>
    </div>
    
    <script src="js/progress.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const exercises = [
                {
                    id: 1,
                    instruction: "全选当前内容",
                    keyCombination: "Ctrl+A",
                    checkKey: function(e) {
                        return e.ctrlKey && e.key === 'a';
                    }
                },
                {
                    id: 2,
                    instruction: "复制选中内容",
                    keyCombination: "Ctrl+C",
                    checkKey: function(e) {
                        return e.ctrlKey && e.key === 'c';
                    }
                },
                {
                    id: 3,
                    instruction: "粘贴内容",
                    keyCombination: "Ctrl+V",
                    checkKey: function(e) {
                        return e.ctrlKey && e.key === 'v';
                    }
                },
                {
                    id: 4,
                    instruction: "保存文件",
                    keyCombination: "Ctrl+S",
                    checkKey: function(e) {
                        return e.ctrlKey && e.key === 's';
                    }
                },
                {
                    id: 5,
                    instruction: "撤销操作",
                    keyCombination: "Ctrl+Z",
                    checkKey: function(e) {
                        return e.ctrlKey && e.key === 'z';
                    }
                }
            ];
            
            let completedCount = 0;
            let correctAttempts = 0;
            let totalAttempts = 0;
            const completedExercises = new Set();
            
            const container = document.getElementById('exercises-container');
            const completedCountEl = document.getElementById('completed-count');
            const accuracyRateEl = document.getElementById('accuracy-rate');
            const completionScreen = document.getElementById('completion-screen');
            
            // 创建练习项目
            exercises.forEach(exercise => {
                const exerciseEl = document.createElement('div');
                exerciseEl.className = 'shortcut-exercise';
                exerciseEl.innerHTML = `
                    <div class="exercise-instruction">${exercise.instruction}</div>
                    <div>请按下: <span class="key-combination">${exercise.keyCombination}</span></div>
                    <div class="feedback" id="feedback-${exercise.id}"></div>
                `;
                container.appendChild(exerciseEl);
            });
            
            // 键盘事件监听
            document.addEventListener('keydown', function(e) {
                totalAttempts++;
                
                exercises.forEach(exercise => {
                    if (!completedExercises.has(exercise.id) && exercise.checkKey(e)) {
                        // 正确按下组合键
                        completedExercises.add(exercise.id);
                        completedCount++;
                        correctAttempts++;
                        
                        const feedbackEl = document.getElementById(`feedback-${exercise.id}`);
                        feedbackEl.textContent = '✓ 正确！';
                        feedbackEl.className = 'feedback correct';
                        feedbackEl.style.display = 'block';
                        
                        updateStats();
                        checkCompletion();
                        
                        e.preventDefault();
                    }
                });
                
                updateStats();
            });
            
            function updateStats() {
                completedCountEl.textContent = completedCount;
                const accuracy = totalAttempts > 0 ? Math.round((correctAttempts / totalAttempts) * 100) : 0;
                accuracyRateEl.textContent = accuracy + '%';
            }
            
            function checkCompletion() {
                if (completedCount === exercises.length) {
                    completionScreen.style.display = 'block';
                    
                    // 保存进度
                    const progressManager = new ProgressManager();
                    progressManager.completeLevel(4, {
                        speed: 100,
                        accuracy: Math.round((correctAttempts / totalAttempts) * 100),
                        time: 0
                    });
                    
                    document.getElementById('next-level-btn').addEventListener('click', function() {
                        window.location.href = 'keyboard_level5.html';
                    });
                }
            }
            
            // 初始化统计
            updateStats();
        });
    </script>
</body>
</html>
